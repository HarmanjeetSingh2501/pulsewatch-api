services:
  - type: web
    name: pulsewatch-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm i -g pnpm && pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false