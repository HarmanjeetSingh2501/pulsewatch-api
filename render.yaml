services:
  - type: web
    name: pulsewatch-api
    env: node
    region: oregon
    plan: free
    buildCommand: npx pnpm@12 install && npx pnpm@12 build
    startCommand: npx pnpm@12 start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false